            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --button-bg: #f8bbd0;
            --button-hover: #f48fb1;
            --progress-default: #e0e0e0;
            --progress-completed: #ff9a9a;
            --result-bg-start: #ffd180;
            --result-bg-end: #81d4fa;
            --border-radius: 15px;
        }

        body {
            font-family: 'Comic Sans MS', '华文彩云', sans-serif;
            background: linear-gradient(to bottom, var(--bg-gradient-start), var(--bg-gradient-end));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        #progress-bar {
            width: 80%;
            max-width: 600px;
            background-color: var(--progress-default);
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 30px;
            background-color: var(--progress-completed);
            border-radius: var(--border-radius);
            transition: width 0.3s ease;
        }

        #question-card {
            background-color: var(--card-bg);
            box-shadow: var(--card-shadow);
            border-radius: var(--border-radius);
            padding: 40px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        #progress-text {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
        }

        .option {
            background-color: var(--button-bg);
            border: none;
            border-radius: var(--border-radius);
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:active {
            transform: scale(0.95);
        }

        #result {
            display: none;
            background: linear-gradient(to bottom, var(--result-bg-start), var(--result-bg-end));
            border-radius: 30px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            font-family: '微软雅黑', '幼圆', sans-serif;
        }

        #restart {
            background-color: var(--button-bg);
            border: none;
            border-radius: var(--border-radius);
            padding: 15px 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #restart:active {
            transform: scale(0.95);
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 0, 1) 20%, rgba(255, 105, 180, 1) 50%, rgba(0, 191, 255, 1) 80%);
        }

        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }
    </style>
</head>

        let currentQuestionIndex = 0;

        function showQuestion() {
            const questionElement = document.getElementById('question');
            const option1Element = document.getElementById('option1');
            const option2Element = document.getElementById('option2');
            const progressTextElement = document.getElementById('progress-text');
            const progressElement = document.getElementById('progress');

            const currentQuestion = questions[currentQuestionIndex];
            questionElement.textContent = currentQuestion.question;
            option1Element.textContent = currentQuestion.options[0];
            option2Element.textContent = currentQuestion.options[1];

            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressElement.style.width = `${progress}%`;
            progressTextElement.textContent = `${currentQuestionIndex + 1}/${questions.length}`;
        }

        function selectOption(optionIndex) {
            questions[currentQuestionIndex].answer = optionIndex;
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                document.getElementById('progress-text').style.display = 'none';
                calculateResult();
            }
        }

        function calculateResult() {
            let eCount = 0;
            let nCount = 0;
            let tCount = 0;
            let jCount = 0;

            // 计分逻辑示例，可按需调整
            for (let i = 0; i < questions.length; i++) {
                if ((i % 4 === 0) && questions[i].answer === 0) eCount++;
                if ((i % 4 === 1) && questions[i].answer === 0) jCount++;
                if ((i % 4 === 2) && questions[i].answer === 0) nCount++;
                if ((i % 4 === 3) && questions[i].answer === 0) tCount++;
            }

            const e = eCount > 0? 'E' : 'I';
            const n = nCount > 0? 'N' : 'S';
            const t = tCount > 0? 'T' : 'F';
            const j = jCount > 0? 'J' : 'P';

            const resultType = e + n + t + j;
            let resultDescription = '';

            switch (resultType) {
                case 'ENTJ':
                    resultDescription = '你是天生的领导者👍，拥有卓越的组织和决策能力，带领团队冲锋陷阵！';
                    break;
                case 'ENFP':
                    resultDescription = '你就像小太阳😜，热情又有创意，走到哪都能带来欢乐！';
                    break;
                case 'INFP':
                    resultDescription = '你内心柔软又浪漫🤗，充满同情心和想象力，是生活中的诗人！';
                    break;
                case 'ISTJ':
                    resultDescription = '你稳重可靠👌，注重细节和秩序，是团队里的定海神针！';
                    break;
                default:
                    resultDescription = `你的 MBTI 类型是 ${resultType}✨，独特又有魅力！`;
            }

            showResult(resultType, resultDescription);
        }

        function showResult(resultType, resultDescription) {
            const questionCard = document.getElementById('question-card');
            const resultElement = document.getElementById('result');
            const resultTitle = document.getElementById('result-title');
            const resultDescriptionElement = document.getElementById('result-description');

            questionCard.style.display = 'none';
            resultElement.style.display = 'block';
            resultTitle.textContent = resultType;
            resultDescriptionElement.textContent = resultDescription;

            createFireworks();
        }

        function createFireworks() {
            const numFireworks = 100;
            for (let i = 0; i < numFireworks; i++) {
                const firework = document.createElement('div');
                firework.classList.add('firework');
                firework.style.left = `${Math.random() * window.innerWidth}px`;
                firework.style.top = `${Math.random() * window.innerHeight}px`;
                const colors = ['#ff69b4', '#ffff00', '#00bfff', '#ff8c00', '#9400d3'];
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(firework);
            }
        }

        function restartTest() {
            currentQuestionIndex = 0;
            for (let i = 0; i < questions.length; i++) {
                questions[i].answer = null;
            }
            const questionCard = document.getElementById('question-card');
            const resultElement = document.getElementById('result');
            const fireworks = document.querySelectorAll('.firework');
            document.getElementById('progress-text').style.display = 'block';

            fireworks.forEach(firework => firework.remove());
            questionCard.style.display = 'block';
            resultElement.style.display = 'none';
            showQuestion();
        }

        showQuestion();
    </script>
